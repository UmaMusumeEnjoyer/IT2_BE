server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: it2-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:it2_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:DUT_IT2_SUPER_SECRET_KEY_FOR_JWT_TOKEN_SIGNING_2026_CHANGE_IN_PROD}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-2.0-flash}
    gemini-base-url: ${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    retrieval-base-url: ${AI_RETRIEVAL_BASE_URL:http://localhost:8000}
    retrieval-path: ${AI_RETRIEVAL_PATH:/api/search}
    retrieval-top-k: ${AI_RETRIEVAL_TOP_K:5}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    system-prompt: ${AI_SYSTEM_PROMPT:}
