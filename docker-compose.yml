services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: it2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-it2_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dut_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-it2_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - it2-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-it2_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_dut_secret}
      JWT_SECRET: ${JWT_SECRET:-DUT_IT2_SUPER_SECRET_KEY_FOR_JWT_TOKEN_SIGNING_2026_CHANGE_IN_PROD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      AI_GEMINI_BASE_URL: ${AI_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      AI_RETRIEVAL_BASE_URL: ${AI_RETRIEVAL_BASE_URL:-http://host.docker.internal:8000}
      AI_RETRIEVAL_PATH: ${AI_RETRIEVAL_PATH:-/api/search}
      AI_RETRIEVAL_TOP_K: ${AI_RETRIEVAL_TOP_K:-5}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - it2-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: it2-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dut.udn.vn
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - it2-network

volumes:
  postgres_data:
    driver: local

networks:
  it2-network:
    driver: bridge
